<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homework</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --blue:#2563eb; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f9fafb; --ok:#16a34a; --warn:#d97706; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(135deg, #3b82f6, #6366f1); color:#fff; padding:20px 16px 16px; position:sticky; top:0; z-index:2; }
  header h1 { margin:0; font-size:26px; }
  header .sub { opacity:.85; font-size:14px; margin-top:2px; }
  .progress { background:rgba(255,255,255,.25); border-radius:99px; height:10px; margin-top:12px; overflow:hidden; }
  .progress > div { background:#fff; height:100%; width:0%; transition:width .3s; }
  .progress-label { font-size:13px; margin-top:6px; opacity:.9; }
  .mission { font-size:16px; font-weight:700; margin-top:8px; }
  main { padding:8px 12px 40px; max-width:640px; margin:0 auto; }
  h2 { font-size:17px; margin:22px 4px 8px; color:var(--ink); }
  h2 .emoji { margin-right:6px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin:8px 0; display:flex; gap:12px; align-items:flex-start; box-shadow:0 1px 3px rgba(17,24,39,.05); }
  .card.done { opacity:.65; }
  .check { flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:2.5px solid var(--blue); background:#fff; color:#fff; font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:2px; }
  .check.claimed { background:var(--warn); border-color:var(--warn); }
  .check.verified { background:var(--ok); border-color:var(--ok); cursor:default; }
  .body { flex:1; min-width:0; }
  .title { font-size:17px; font-weight:600; line-height:1.3; }
  .meta { font-size:13.5px; color:var(--muted); margin-top:3px; line-height:1.45; }
  .chip { display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.02em; background:#eff6ff; color:var(--blue); border-radius:99px; padding:2px 8px; margin-bottom:5px; }
  .pill { display:inline-block; font-size:11.5px; font-weight:700; border-radius:99px; padding:2px 8px; margin-left:6px; vertical-align:2px; }
  .pill.open { background:#fef3c7; color:#92400e; }
  .pill.claimed { background:#ffedd5; color:#9a3412; }
  .pill.verified { background:#dcfce7; color:#166534; }
  .empty { color:var(--muted); font-size:15px; padding:6px 4px; }
  .badge { display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.03em; border-radius:99px; padding:2px 8px; margin-left:6px; vertical-align:2px; }
  .badge.over { background:#ffe1db; color:#b3402f; }
  .badge.today { background:#ffe9bd; color:#92600a; }
  .badge.soon { background:#fff3c4; color:#8a6d1a; }
  .card.u-over { background:#fff6f3; border-color:#f6cfc7; border-left:4px solid #f0766b; }
  .card.u-today { background:#fffaf0; border-color:#f3ddba; border-left:4px solid #f5a524; }
  .card.u-soon { background:#fffdf4; border-color:#f0e3b2; border-left:4px solid #eec643; }
  .due { font-weight:600; }
  .due.over { color:#cf4b3f; }
  .due.today { color:#c77400; }
  .due.soon { color:#a07d10; }
  .banner { border-radius:14px; padding:14px; margin:14px 0 4px; font-size:16px; font-weight:600; text-align:center; }
  .banner.celebrate { background:#dcfce7; color:#166534; animation:pop-in .45s ease-out; }
  @keyframes pop-in { 0% { transform:scale(.8); opacity:0; } 60% { transform:scale(1.05); opacity:1; } 100% { transform:scale(1); } }
  .banner.stale { background:#fef3c7; color:#92400e; font-weight:500; font-size:14.5px; }
  footer { text-align:center; color:var(--muted); font-size:12.5px; padding:0 16px 28px; }
</style>
</head>
<body>
<header>
  <h1>📚 Homework</h1>
  <div class="sub" id="updated">Loading…</div>
  <div class="progress"><div id="bar"></div></div>
  <div class="progress-label" id="barLabel"></div>
  <div class="mission" id="mission" style="display:none"></div>
</header>
<main id="app"></main>
<footer>Tap the circle when you finish something.<br>It turns green when Dad verifies it in Canvas/PowerSchool.<br>🔴 Overdue &nbsp;·&nbsp; 🟠 Due today &nbsp;·&nbsp; 🟡 Due soon</footer>

<script>
const LS_KEY = "hw-claimed-v1";
let data = null;

function claimedSet() {
  try { return new Set(JSON.parse(localStorage.getItem(LS_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveClaimed(s) { localStorage.setItem(LS_KEY, JSON.stringify([...s])); }

const SUBJECTS = {
  "Math": { icon: "🔢", bg: "#e0e7ff", fg: "#3730a3" },
  "ELA": { icon: "📖", bg: "#ffe4e6", fg: "#9f1239" },
  "Science": { icon: "🔬", bg: "#dcfce7", fg: "#166534" },
  "Tech Apps": { icon: "🖥️", bg: "#e0f2fe", fg: "#075985" },
  "Study Skills": { icon: "🎯", bg: "#ede9fe", fg: "#5b21b6" },
  "World Cultures": { icon: "🌍", bg: "#fef3c7", fg: "#92400e" },
  "Theatre": { icon: "🎭", bg: "#fae8ff", fg: "#86198f" },
  "PE": { icon: "⚽", bg: "#ecfccb", fg: "#3f6212" }
};

function subjectChip(item) {
  const s = SUBJECTS[item.subject];
  if (!s) return `<span class="chip">${item.subject}</span>`;
  return `<span class="chip" style="background:${s.bg};color:${s.fg}">${s.icon} ${item.subject}</span>`;
}

function statusOf(item, claimed) {
  if (item.status === "verified") return "verified";
  if (claimed.has(item.id)) return "claimed";
  return "open";
}

// Days from today until the item's due date (negative = overdue). Null when no date.
function daysUntil(item) {
  if (!item.due) return null;
  const p = item.due.split("-").map(Number);
  if (p.length !== 3 || p.some(isNaN)) return null;
  const due = new Date(p[0], p[1] - 1, p[2]);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((due - today) / 86400000);
}

function dueTier(item) {
  const d = daysUntil(item);
  if (d === null) return { cls: "", card: "" };
  if (d < 0) return { cls: "over", card: " u-over" };
  if (d === 0) return { cls: "today", card: " u-today" };
  if (d <= 3) return { cls: "soon", card: " u-soon" };
  return { cls: "", card: "" };
}

function urgencyBadge(item) {
  const d = daysUntil(item);
  if (d === null) return "";
  if (d < 0) return '<span class="badge over">OVERDUE</span>';
  if (d === 0) return '<span class="badge today">DUE TODAY</span>';
  if (d === 1) return '<span class="badge soon">DUE TOMORROW</span>';
  return "";
}

function byUrgency(a, b) {
  const da = daysUntil(a), db = daysUntil(b);
  const ka = da === null ? 9999 : da, kb = db === null ? 9999 : db;
  if (ka !== kb) return ka - kb;
  return (a.title || "").localeCompare(b.title || "");
}

function card(item, claimed) {
  const st = statusOf(item, claimed);
  const tier = st === "verified" ? { cls: "", card: "" } : dueTier(item);
  const el = document.createElement("div");
  el.className = "card" + (st === "verified" ? " done" : "") + tier.card;
  const pill = st === "verified" ? '<span class="pill verified">Verified ✓</span>'
             : st === "claimed" ? '<span class="pill claimed">I did it</span>'
             : '<span class="pill open">To do</span>';
  el.innerHTML = `
    <button class="check ${st}" aria-label="mark done">${st === "open" ? "" : "✓"}</button>
    <div class="body">
      ${subjectChip(item)}${pill}${st === "verified" ? "" : urgencyBadge(item)}
      <div class="title">${item.title}</div>
      <div class="meta">${item.dueLabel ? `<span class="due ${tier.cls}">${item.dueLabel}</span>` : ""}${item.note ? " · " + item.note : ""}</div>
    </div>`;
  const btn = el.querySelector(".check");
  if (st !== "verified") {
    btn.addEventListener("click", () => {
      const s = claimedSet();
      const checking = !s.has(item.id);
      if (checking) s.add(item.id); else s.delete(item.id);
      saveClaimed(s);
      if (checking && btn.animate) {
        btn.animate(
          [{ transform: "scale(1)" }, { transform: "scale(1.35)" }, { transform: "scale(1)" }],
          { duration: 220, easing: "ease-out" }
        );
        setTimeout(render, 170);
      } else {
        render();
      }
    });
  }
  return el;
}

function section(emoji, label, items, claimed) {
  const h = document.createElement("h2");
  h.innerHTML = `<span class="emoji">${emoji}</span>${label}`;
  const frag = document.createDocumentFragment();
  frag.appendChild(h);
  if (!items.length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Nothing here. 🎉";
    frag.appendChild(p);
  }
  items.forEach(i => frag.appendChild(card(i, claimed)));
  return frag;
}

const CONFETTI_COLORS = ["#f0766b", "#f5a524", "#eec643", "#4ade80", "#60a5fa", "#a78bfa", "#f472b6"];
function reducedMotion() {
  return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function confettiPiece() {
  const s = document.createElement("span");
  const round = Math.random() < 0.3;
  const w = 6 + Math.random() * 6;
  s.style.cssText = "position:fixed;z-index:99;pointer-events:none;background:" +
    CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)] +
    ";width:" + w + "px;height:" + (round ? w : w * 1.5) + "px;border-radius:" + (round ? "50%" : "2px");
  return s;
}
function confettiBurst(count) {
  if (reducedMotion()) return;
  for (let n = 0; n < count; n++) {
    const s = confettiPiece();
    s.style.top = "-14px";
    s.style.left = (Math.random() * 100) + "vw";
    document.body.appendChild(s);
    const drift = Math.random() * 120 - 60;
    const anim = s.animate([
      { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
      { transform: "translate(" + drift + "px, 105vh) rotate(" + (Math.random() * 720 - 360) + "deg)", opacity: 0.9 }
    ], { duration: 2400 + Math.random() * 1400, easing: "cubic-bezier(.2,.7,.4,1)" });
    anim.onfinish = () => s.remove();
  }
}
function confettiCannon(side) {
  if (reducedMotion()) return;
  const dir = side === "left" ? 1 : -1;
  for (let n = 0; n < 16; n++) {
    const s = confettiPiece();
    s.style.bottom = "0px";
    s.style.left = side === "left" ? "0px" : "auto";
    s.style.right = side === "right" ? "0px" : "auto";
    document.body.appendChild(s);
    const spread = 30 + Math.random() * 30;
    const up = 45 + Math.random() * 25;
    const anim = s.animate([
      { transform: "translate(0,0) rotate(0deg)", opacity: 1, offset: 0 },
      { transform: "translate(" + (dir * spread * 0.7) + "vw, -" + up + "vh) rotate(" + (Math.random() * 360) + "deg)", opacity: 1, offset: 0.45 },
      { transform: "translate(" + (dir * spread) + "vw, 15vh) rotate(" + (Math.random() * 720) + "deg)", opacity: 0.7, offset: 1 }
    ], { duration: 1900 + Math.random() * 700, easing: "cubic-bezier(.15,.6,.4,1)", delay: Math.random() * 120 });
    anim.onfinish = () => s.remove();
  }
}
function fireworkBurst(xVw, yVh, count) {
  if (reducedMotion()) return;
  count = count || 30;
  for (let n = 0; n < count; n++) {
    const s = confettiPiece();
    s.style.left = xVw + "vw";
    s.style.top = yVh + "vh";
    document.body.appendChild(s);
    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 130;
    const dx = Math.cos(ang) * dist;
    const dy = Math.sin(ang) * dist;
    const anim = s.animate([
      { transform: "translate(0,0) scale(1)", opacity: 1, offset: 0 },
      { transform: "translate(" + dx + "px," + dy + "px) scale(1)", opacity: 1, offset: 0.4 },
      { transform: "translate(" + (dx * 1.15) + "px," + (dy + 95) + "px) scale(0.7)", opacity: 0, offset: 1 }
    ], { duration: 1200 + Math.random() * 500, easing: "cubic-bezier(.15,.6,.4,1)" });
    anim.onfinish = () => s.remove();
  }
}

function bigCelebration() {
  confettiBurst(42);
  setTimeout(() => { confettiCannon("left"); confettiCannon("right"); }, 300);
  setTimeout(() => fireworkBurst(50, 30, 34), 800);
  setTimeout(() => fireworkBurst(22, 42, 26), 1180);
  setTimeout(() => fireworkBurst(78, 38, 26), 1500);
}

let celebratedAll = false, celebratedMission = false;
function celebrateAll() {
  if (celebratedAll) return;
  celebratedAll = true;
  bigCelebration();
}
function celebrateMission() {
  if (celebratedMission) return;
  celebratedMission = true;
  confettiBurst(22);
  setTimeout(() => fireworkBurst(50, 32, 24), 350);
}

function render() {
  if (!data) return;
  const claimed = claimedSet();
  const app = document.getElementById("app");
  app.innerHTML = "";
  const items = data.items;
  const open = items.filter(i => i.status !== "verified");
  const done = items.filter(i => i.status === "verified");

  if (items.length && !open.length) {
    const b = document.createElement("div");
    b.className = "banner celebrate";
    b.textContent = "🎉 Everything is done and checked. Nice work!";
    app.appendChild(b);
    celebrateAll();
  }
  const ageHours = (Date.now() - new Date(data.updated)) / 3600000;
  if (isFinite(ageHours) && ageHours > 26) {
    const b = document.createElement("div");
    b.className = "banner stale";
    b.textContent = "This list has not been updated in a while. Ask Dad to check it.";
    app.appendChild(b);
  }

  app.appendChild(section("💻", "Laptop", open.filter(i => i.kind === "laptop").sort(byUrgency), claimed));
  app.appendChild(section("📄", "Paper", open.filter(i => i.kind === "paper").sort(byUrgency), claimed));
  app.appendChild(section("🏫", "At school", open.filter(i => i.kind === "school").sort(byUrgency), claimed));
  app.appendChild(section("✅", "Done and verified", done, claimed));

  const total = items.length || 1;
  const finished = done.length + open.filter(i => claimed.has(i.id)).length;
  const bar = document.getElementById("bar");
  bar.style.width = Math.round(finished / total * 100) + "%";
  bar.style.background = (items.length && finished === items.length) ? "#4ade80" : "";

  const missionItems = open.filter(i => (i.kind === "laptop" || i.kind === "paper") && daysUntil(i) !== null && daysUntil(i) <= 1);
  const mEl = document.getElementById("mission");
  if (missionItems.length) {
    const left = missionItems.filter(i => !claimed.has(i.id)).length;
    mEl.textContent = left ? "🎯 Tonight's mission: " + left + " to do" : "🎯 Tonight's mission: done!";
    mEl.style.display = "";
    if (!left) celebrateMission();
  } else {
    mEl.style.display = "none";
  }
  document.getElementById("barLabel").textContent = `${finished} of ${items.length} finished`;
  const d = new Date(data.updated);
  document.getElementById("updated").textContent =
    "Updated " + d.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit", month: "short", day: "numeric" });
}

async function load() {
  try {
    const r = await fetch("data.json?ts=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    if (!data) {
      document.getElementById("updated").textContent = "Could not load the list. Check connection and reopen.";
      return;
    }
  }
  render();
}

load();
setInterval(load, 5 * 60 * 1000); // refresh data every 5 min while open

// Dad preview: tap the title 3 times quickly to test the confetti.
let titleTaps = [];
document.querySelector("header h1").addEventListener("click", () => {
  const now = Date.now();
  titleTaps = titleTaps.filter(t => now - t < 1500);
  titleTaps.push(now);
  if (titleTaps.length >= 3) { titleTaps = []; bigCelebration(); }
});

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
